<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Buzón CUC Escucha</h1>
        <p>Facultad de Ingeniería - Universidad de la Costa</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Envía tu sugerencia</h2>
            <form>
                <div class="grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Pérez" required>
                </div>

                <div class="grupo">
                    <label for="correo">Correo institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@cuc.edu.co" required>
                </div>

                <div class="grupo">
                    <label for="aspecto">Aspecto a mejorar</label>
                    <select id="aspecto" name="aspecto" required>
                        <option value="">Seleccione una opción</option>
                        <option value="bienestar">Bienestar</option>
                        <option value="servicios">Servicios</option>
                        <option value="clases">Clases</option>
                        <option value="inclusion">Inclusión</option>
                        <option value="espacios">Espacios</option>
                        <option value="procesos">Procesos académicos</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="sugerencia">Descripción de la idea o sugerencia</label>
                    <textarea id="sugerencia" name="sugerencia" rows="4" placeholder="Escribe aquí tu propuesta..." required></textarea>
                </div>

                <button type="submit">Enviar sugerencia</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Universidad de la Costa | Facultad de Ingeniería</p>
    </footer>

</body>

</html>
